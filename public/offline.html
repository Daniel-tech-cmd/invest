<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — GoldGroveco</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Sora, Arial, sans-serif;
        background: #07080b;
        color: #f5f2e9;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .mark {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        margin: 0 auto 20px;
        background: linear-gradient(135deg, #e7b94b, #1fae7e);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 700;
        font-size: 34px;
        color: #0c0d10;
      }
      h1 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
      p { font-size: 13px; color: #a8a49a; max-width: 320px; margin: 0 auto 20px; line-height: 1.5; }
      button {
        background: #e7b94b;
        color: #0c0d10;
        border: none;
        border-radius: 10px;
        padding: 10px 20px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="mark">G</div>
      <h1>You&rsquo;re offline</h1>
      <p>GoldGroveco needs a connection to show your live balance and account activity. Reconnect and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
